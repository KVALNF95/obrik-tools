# ══════════════════════════════════════════════════════════════════
#  drones.cfg — справочник дронов и полётников для obrik_ui.py
#
#  ЧТОБЫ ДОБАВИТЬ НОВЫЙ ПОЛЁТНИК — скопируйте секцию [fc:...]:
#     [fc:короткое_имя]        ← латиницей, без пробелов
#     name         = ...       ← как показывать в списке
#     bootloader   = ...       ← пути относительно папки obrik-tools
#     firmware     = ...         (или абсолютные)
#     firmware_bin = ...
#
#  ЧТОБЫ ДОБАВИТЬ НОВЫЙ ДРОН — скопируйте секцию [drone:...]:
#     [drone:короткое_имя]
#     name        = ...        ← как показывать в списке
#     fc          = ...        ← полётник по умолчанию (id из [fc:...])
#     params_file = ...        ← файл параметров этого дрона
#
#  UI подхватывает изменения при обновлении страницы в браузере.
# ══════════════════════════════════════════════════════════════════


# ─── ПОЛЁТНИКИ ────────────────────────────────────────────────────

[fc:matek_h743_slim]
name         = Matek H743-Slim
bootloader   = firmware/matek_h743-slim_bootloader.bin
firmware     = firmware/matek_h743-slim_default.px4
firmware_bin = firmware/matek_h743-slim_default.bin

# [fc:другой_полётник]
# name         = Название в списке
# bootloader   = firmware/..._bootloader.bin
# firmware     = firmware/..._default.px4
# firmware_bin = firmware/..._default.bin


# ─── ДРОНЫ ────────────────────────────────────────────────────────

[drone:obrik]
name        = Обрик
fc          = matek_h743_slim
params_file = params/obrik_last.params

[drone:mocap]
name        = Дрон под mocap
fc          = matek_h743_slim
params_file = params/mocap.params

[drone:optical_flow]
name        = Дрон с optical flow
fc          = matek_h743_slim
params_file = params/Optical_flow.params

# [drone:новый_дрон]
# name        = Название в списке
# fc          = matek_h743_slim
# params_file = params/новый_дрон.params
