# ══════════════════════════════════════════════════════════════════
#  drones.cfg — справочник дронов, полётников и ПО для obrik_ui.py
#
#  Три вида секций:
#    [fc:...]    — полётник (железо), только название
#    [soft:...]  — ПО (стек) для конкретного полётника: загрузчик + прошивка
#    [drone:...] — дрон: штатный полётник, штатное ПО, файл параметров
#
#  В UI выбираются только ТИП ДРОНА и ПЛАТА. ПО (стек) выбирать не нужно —
#  оно однозначно определяется платой: для платы берётся [soft:...] с
#  соответствующим fc. У дрона подставляется штатная плата (её можно сменить).
#
#  Про чужие прошивки: если на плате Betaflight/ArduPilot или другая
#  версия загрузчика, скрипт сам увидит несовпадение, сделает mass-erase
#  и прошьёт наш загрузчик. Если загрузчик уже наш — шаг пропускается.
#
#  ЧТОБЫ ДОБАВИТЬ ПОЛЁТНИК:
#     [fc:короткое_имя]        ← латиницей, без пробелов
#     name = ...               ← как показывать в списке
#
#  ЧТОБЫ ДОБАВИТЬ ПО (например ArduPilot для того же полётника):
#     [soft:короткое_имя]
#     name         = ...       ← как показывать в списке
#     fc           = ...       ← для какого полётника (id из [fc:...])
#     bootloader   = ...       ← пути относительно папки obrik-tools
#     firmware     = ...
#     firmware_bin = ...
#
#  ЧТОБЫ ДОБАВИТЬ ДРОН:
#     [drone:короткое_имя]
#     name        = ...        ← как показывать в списке
#     fc          = ...        ← штатный полётник (id из [fc:...])
#     soft        = ...        ← штатное ПО (id из [soft:...])
#     params_file = ...        ← файл параметров этого дрона
#     beacon      = yes|no     ← отключать ли писк ESC (шаг 4).
#                                yes — только для платформ типа «Обрик».
#                                по умолчанию no (шаг 4 пропускается)
#
#  UI подхватывает изменения при перезапуске приложения.
# ══════════════════════════════════════════════════════════════════


# ─── ПОЛЁТНИКИ (железо) ───────────────────────────────────────────

# usb_id — как плата (с запущенным PX4) определяется в lsusb: VID:PID.
# По нему скрипт узнаёт реально подключённую плату и предупреждает, если
# она не совпадает с выбранной (напр. выбрали Pixhawk, а воткнут Matek).
# Можно перечислить несколько через запятую.

[fc:matek_h743]
name = Matek H743
usb_id = 1209:1013

[fc:micoair_h743_lite]
name = MicoAir H743 Lite
# TODO: подключите MicoAir с PX4 и впишите его VID:PID из `lsusb`
# usb_id =

[fc:holybro_6x]
name = Holybro Pixhawk 6X
# TODO: подключите Pixhawk 6X с PX4 и впишите его VID:PID из `lsusb`
# usb_id =

[fc:speedybee]
name = SpeedyBee
# на SpeedyBee всегда Betaflight — ПО пока не заводим (стек не добавлен),
# поэтому прошивка из этого инструмента для неё недоступна


# ─── ПО (стеки) ───────────────────────────────────────────────────
# по умолчанию на все полётники (кроме SpeedyBee) ставится PX4.
# Каждый стек собирается из своей ветки форка petayyyy/PX4-Autopilot.

[soft:px4_matek_h743]
name         = PX4
fc           = matek_h743
# резерв из комплекта — используется, если исходников на машине нет
bootloader   = firmware/matek_h743-slim_bootloader.bin
firmware     = firmware/matek_h743-slim_default.px4
firmware_bin = firmware/matek_h743-slim_default.bin
# сборка из исходников: перед прошивкой проверяются обновления ветки
# на git; если есть — пересборка и прошивка свежим билдом
px4_src      = ~/Documents/Applications/px4/recursive
px4_repo     = https://github.com/petayyyy/PX4-Autopilot.git
px4_branch   = sverk-v1.15.4-dds-fixes
px4_target   = matek_h743-slim_default

[soft:px4_micoair_h743_lite]
name         = PX4
fc           = micoair_h743_lite
px4_src      = ~/Documents/Applications/px4/recursive
px4_repo     = https://github.com/petayyyy/PX4-Autopilot.git
px4_branch   = sverk-v1.15.4-micoair-dds-fixes
# TODO: уточнить точное имя таргета для MicoAir H743 Lite на этой ветке
px4_target   = micoair_h743_default

[soft:px4_holybro_6x]
name         = PX4
fc           = holybro_6x
px4_src      = ~/Documents/Applications/px4/recursive
px4_repo     = https://github.com/petayyyy/PX4-Autopilot.git
px4_branch   = sverk-v1.15.4-holybro6x
# Pixhawk 6X — стандартный FMUv6X
px4_target   = px4_fmu-v6x_default


# ─── ДРОНЫ ────────────────────────────────────────────────────────

# images — образы для записи на SD-карту (Raspberry Pi борта). Формат:
#   images = Имя1:путь1.img, Имя2:путь2.img   (путь от папки obrik-tools или абс.)
# В UI появляется выбор образа; у Обрика их два (ROS1/ROS2), у остальных свои.

[drone:obrik]
name        = Обрик
fc          = matek_h743
soft        = px4_matek_h743
params_file = params/obrik_stable.params
beacon      = yes
images      = ROS1:images/obrik_ros1.img, ROS2:images/obrik_ros2.img

[drone:gigaobrik]
name        = Гигаобрик
fc          = matek_h743
soft        = px4_matek_h743
params_file = params/gigaobrik.params
beacon      = yes
images      = Основной:images/gigaobrik.img

# Новые дроны. fc/soft/params/beacon — выставлены по умолчанию (Matek H743 +
# PX4), ПОПРАВЬТЕ под реальные платы и положите файлы параметров в params/.
[drone:pozharnik]
name        = Пожарник
fc          = matek_h743
soft        = px4_matek_h743
params_file = params/pozharnik.params
beacon      = no
images      = Основной:images/pozharnik.img

[drone:dostavshik]
name        = Доставщик
fc          = holybro_6x
soft        = px4_holybro_6x
params_file = params/dostavshik.params
beacon      = no
images      = Основной:images/dostavshik.img

# Дежурник: по умолчанию Matek+PX4. Если на борту SpeedyBee — переключите
# полётник в UI (на SpeedyBee Betaflight, этот стек пока не заведён).
[drone:dezhurnik]
name        = Дежурник
fc          = matek_h743
soft        = px4_matek_h743
params_file = params/dezhurnik.params
beacon      = no
images      = Основной:images/dezhurnik.img
