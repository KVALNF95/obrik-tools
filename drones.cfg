# ══════════════════════════════════════════════════════════════════
#  drones.cfg — справочник дронов, полётников и ПО для obrik_ui.py
#
#  Три вида секций:
#    [fc:...]    — полётник (железо), только название
#    [soft:...]  — ПО (стек) для конкретного полётника: загрузчик + прошивка
#    [drone:...] — дрон: штатный полётник, штатное ПО, файл параметров
#
#  В UI у дрона по умолчанию подставляются его штатные полётник и ПО,
#  но их можно сменить на любые из перечня ниже.
#
#  Про чужие прошивки: если на плате Betaflight/ArduPilot или другая
#  версия загрузчика, скрипт сам увидит несовпадение, сделает mass-erase
#  и прошьёт наш загрузчик. Если загрузчик уже наш — шаг пропускается.
#
#  ЧТОБЫ ДОБАВИТЬ ПОЛЁТНИК:
#     [fc:короткое_имя]        ← латиницей, без пробелов
#     name = ...               ← как показывать в списке
#
#  ЧТОБЫ ДОБАВИТЬ ПО (например ArduPilot для того же полётника):
#     [soft:короткое_имя]
#     name         = ...       ← как показывать в списке
#     fc           = ...       ← для какого полётника (id из [fc:...])
#     bootloader   = ...       ← пути относительно папки obrik-tools
#     firmware     = ...
#     firmware_bin = ...
#
#  ЧТОБЫ ДОБАВИТЬ ДРОН:
#     [drone:короткое_имя]
#     name        = ...        ← как показывать в списке
#     fc          = ...        ← штатный полётник (id из [fc:...])
#     soft        = ...        ← штатное ПО (id из [soft:...])
#     params_file = ...        ← файл параметров этого дрона
#
#  UI подхватывает изменения при перезапуске приложения.
# ══════════════════════════════════════════════════════════════════


# ─── ПОЛЁТНИКИ (железо) ───────────────────────────────────────────

[fc:matek_h743_slim]
name = Matek H743-Slim


# ─── ПО (стеки) ───────────────────────────────────────────────────

[soft:px4_matek_h743]
name         = PX4
fc           = matek_h743_slim
# резерв из комплекта — используется, если исходников на машине нет
bootloader   = firmware/matek_h743-slim_bootloader.bin
firmware     = firmware/matek_h743-slim_default.px4
firmware_bin = firmware/matek_h743-slim_default.bin
# сборка из исходников: перед прошивкой проверяются обновления ветки
# на git; если есть — пересборка и прошивка свежим билдом
px4_src      = ~/Documents/Applications/px4/recursive
px4_repo     = https://github.com/petayyyy/PX4-Autopilot.git
px4_branch   = sverk-v1.15.4-dds-fixes
px4_target   = matek_h743-slim_default

# [soft:ardupilot_matek_h743]
# name         = ArduPilot
# fc           = matek_h743_slim
# bootloader   = firmware/..._bootloader.bin
# firmware     = firmware/..._default.px4
# firmware_bin = firmware/..._default.bin


# ─── ДРОНЫ ────────────────────────────────────────────────────────

[drone:obrik]
name        = Обрик
fc          = matek_h743_slim
soft        = px4_matek_h743
params_file = params/obrik_last.params

[drone:mocap]
name        = Дрон под mocap
fc          = matek_h743_slim
soft        = px4_matek_h743
params_file = params/mocap.params

[drone:optical_flow]
name        = Дрон с optical flow
fc          = matek_h743_slim
soft        = px4_matek_h743
params_file = params/Optical_flow.params
