# obrik_flash.cfg — конфиг для утилиты obrik_flash.py
#
# Пути можно указывать:
#   - относительно этой папки (напр. firmware/foo.px4) — так работает зипка;
#   - абсолютно (/home/.../foo.px4) — если файлы лежат в другом месте.

# загрузчик (DFU) — прошивается один раз при сборке полётника
bootloader   = /home/vladimir/Documents/Applications/px4/matek_h743-slim_bootloader.bin

# основная прошивка PX4 (с драйвером dshot_4way) — .px4 для px_uploader
firmware     = /home/vladimir/Documents/Applications/px4/matek_h743-slim_default.px4

# прошивка .bin для прямой заливки через DFU (если не указано — ищется рядом с .px4)
firmware_bin = /home/vladimir/Documents/Applications/px4/matek_h743-slim_default.bin

# файл параметров для заливки
params_file  = params/obrik_last.params

# инструменты PX4 (вендоренные px_uploader.py / mavlink_shell.py)
px4_tools    = tools

# адрес flash для загрузчика
dfu_address  = 0x08000000

# адрес flash для основной прошивки (APP_LOAD_ADDRESS из hw_config.h)
app_address  = 0x08020000

# скорость MAVLink
baud         = 57600

# значение Beacon Delay (1=1m..4=10m, 5=Infinite)
beacon_value = 5

# количество моторов/ESC
num_motors   = 4

# шаг 1: mass-erase перед записью загрузчика одной DFU-командой
#   1 = чистый старт (стереть весь чип, затем записать загрузчик) — по умолчанию
#   0 = только записать загрузчик, чип не стирать
# mass-erase делается автоматически только для чужого стека (Betaflight/
# ArduPilot). 1 — принудительно стирать flash при каждой прошивке загрузчика.
bl_mass_erase = 0
